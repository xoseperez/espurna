[platformio]
src_dir = espurna

[env:esp32-relay-x2]
platform = espressif32 @ 6.3.2
board = esp32dev
framework = arduino
build_flags = -DARDUINO_ARCH_ESP32 -DESP32_RELAY_X2 -DWEB_SUPPORT=1 -DAPI_SUPPORT=1 -DMQTT_SUPPORT=1 -DTERMINAL_SUPPORT=1 -DALEXA_SUPPORT=1 -DHOMEASSISTANT_SUPPORT=1 -DDOMOTICZ_SUPPORT=1 -DSENSOR_SUPPORT=1 -DPWM_SUPPORT=1 -Wl,-z,muldefs -Iespurna/arch/esp32 -Iespurna/arch/esp32/include
lib_ldf_mode = deep+
lib_deps = 
    esphome/AsyncTCP-esphome @ 2.1.4
    esphome/ESPAsyncWebServer-esphome @ 3.4.0
    bblanchon/ArduinoJson@5.13.4
    EEPROM
    heman/AsyncMqttClient-esphome @ 2.1.0
    vintlabs/FauxmoESP @ 3.4.1
lib_ignore = 
    AsyncTCP
build_src_filter = +<*> -<arch/esp8266> +<arch/esp32>
extra_scripts = post:scripts/esp32_merge.py
