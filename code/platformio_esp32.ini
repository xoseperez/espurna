; ESP32 on Arduino-ESP32 core 3.x (ESP-IDF 5.x) via pioarduino. Needs PlatformIO Core >= 6.2; its tool installer
; (idf_tools.py) refuses MSYS, run it outside Git Bash.
;
; Flash layout (esp32_4mb_safeboot.csv, Tasmota's offsets): factory app with the ESPurna safeboot (code/safeboot-app)
; at 0x10000 and one 2880 KB app slot for ESPurna at 0xE0000. OTA goes through the safeboot (WebUI /safeboot, the
; `safeboot` command or the crash-loop guard, ref. arch/esp32/safeboot_esp32.cpp). Boards on the old two-slot layout
; move over from the WebUI (/safeboot, Migrate), no serial flash.
;
; One image for every board (esp32-generic): relays, buttons and LEDs come from the settings, written by the device
; template search of the WebUI (or by hand). The NSPanel keeps its own image for its screen driver.
;
; Matter (On/Off plugs, one per relay, up to 4) is in every image and starts with `matterAuto 1` or MATTER.START.
; RAM is what limits it: commissioning needs tens of KB of free heap at once. The quiet mode of matter.cpp (web socket
; clients, MQTT and Alexa off while a controller commissions) leaves enough with all modules: esp32-relay-x2 tested
; 11-05 with matter-server, heap lowest ~0.9 KB - tight.
; Every board makes its own setup codes and device attestation on the first Matter start (arch/esp32/
; matter_identity_esp32.cpp), kept in NVS across updates.
; No ArduinoOTA and no OTA client: on this layout they would write the running slot

[platformio]
src_dir = espurna

[esp32-common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
board_build.partitions = esp32_4mb_safeboot.csv
; no dout: the pioarduino libraries come per memory type (dio_qspi / qio_qspi), dout has no sdkconfig.h. The board's
; bootloader sets the flash mode at boot
framework = arduino
build_flags = -DARDUINO_ARCH_ESP32 -DWEB_SUPPORT=1 -DAPI_SUPPORT=1 -DMQTT_SUPPORT=1 -DTERMINAL_SUPPORT=1 -DMATTER_SUPPORT=1
    -DOTA_ARDUINOOTA_SUPPORT=0 -DOTA_CLIENT=OTA_CLIENT_NONE
    -Iespurna/arch/esp32
modules_all = -DALEXA_SUPPORT=1 -DHOMEASSISTANT_SUPPORT=1 -DDOMOTICZ_SUPPORT=1 -DSENSOR_SUPPORT=1 -DPWM_SUPPORT=1
; chain+: with deep+ the LDF of PlatformIO 6.2 left Networking off the include path of WiFi / AsyncTCP
lib_ldf_mode = chain+
; ESPAsyncWebServer comes from lib_esp32/ESPAsyncWebServer-espurna, esphome 3.4.0 patched
; to make AsyncWebSocket safe to use from the loop task while AsyncTCP callbacks run in
; the async_tcp task (ref. the note in its src/AsyncWebSocket.h)
lib_extra_dirs =
    lib_esp32
; AsyncTCP: ESP32Async's 3.x (same API) - esphome's 2.1.4 includes IPv6Address.h, gone in core 3.x
lib_deps =
    ESP32Async/AsyncTCP @ ^3.4.0
    bblanchon/ArduinoJson@5.13.4
    ; core 3.x splits the network stack into its own libraries, the LDF does not find them from AsyncTCP
    Networking
    WiFi
    heman/AsyncMqttClient-esphome @ 2.1.0
    vintlabs/FauxmoESP @ 3.4.1
lib_ignore =
    AsyncTCP-esphome
    ESPAsyncWebServer-esphome
build_src_filter = +<*> -<arch/esp8266> +<arch/esp32>
extra_scripts =
    pre:scripts/esp32_v3_paths.py
    post:scripts/esp32_merge.py

; Sonoff NSPanel gen1 (EU). Installed over Tasmota (same safeboot layout), flash firmware.bin from the Tasmota
; safeboot web UI, not the merged image
[env:esp32-nspanel]
extends = esp32-common
build_flags = ${esp32-common.build_flags} ${esp32-common.modules_all} -DSONOFF_NSPANEL -DESPURNA_IMAGE=\"esp32-matter-nspanel\"

; Any ESP32 with 4 MB flash, no GPIOs pre-assigned (device template, Tasmota template or settings). Boards that ran the
; per-board images before (LC-Tech relay x2, Sonoff MINIR4) need their pins in the settings first, ref. README
[env:esp32-generic]
extends = esp32-common
build_flags = ${esp32-common.build_flags} ${esp32-common.modules_all} -DESP32_GENERIC -DESPURNA_IMAGE=\"esp32-matter\"
