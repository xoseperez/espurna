[platformio]
src_dir = espurna

[esp32-common]
platform = espressif32 @ 6.3.2
board = esp32dev
board_build.partitions = min_spiffs.csv
board_build.flash_mode = dout
framework = arduino
build_flags = -DARDUINO_ARCH_ESP32 -DWEB_SUPPORT=1 -DAPI_SUPPORT=1 -DMQTT_SUPPORT=1 -DTERMINAL_SUPPORT=1 -DALEXA_SUPPORT=1 -DHOMEASSISTANT_SUPPORT=1 -DDOMOTICZ_SUPPORT=1 -DSENSOR_SUPPORT=1 -DPWM_SUPPORT=1 -Iespurna/arch/esp32
lib_ldf_mode = deep+
; ESPAsyncWebServer comes from lib_esp32/ESPAsyncWebServer-espurna, esphome 3.4.0 patched
; to make AsyncWebSocket safe to use from the loop task while AsyncTCP callbacks run in
; the async_tcp task (ref. the note in its src/AsyncWebSocket.h)
lib_extra_dirs =
    lib_esp32
lib_deps =
    esphome/AsyncTCP-esphome @ 2.1.4
    bblanchon/ArduinoJson@5.13.4
    EEPROM
    heman/AsyncMqttClient-esphome @ 2.1.0
    vintlabs/FauxmoESP @ 3.4.1
lib_ignore =
    AsyncTCP
    ESPAsyncWebServer-esphome
build_src_filter = +<*> -<arch/esp8266> +<arch/esp32>
extra_scripts = post:scripts/esp32_merge.py

; LC-Tech ESP32 2-relay board
[env:esp32-relay-x2]
extends = esp32-common
build_flags = ${esp32-common.build_flags} -DESP32_RELAY_X2

; Any ESP32 with 4 MB flash, no GPIOs pre-assigned (configure at runtime / Tasmota template)
[env:esp32-generic]
extends = esp32-common
build_flags = ${esp32-common.build_flags} -DESP32_GENERIC
