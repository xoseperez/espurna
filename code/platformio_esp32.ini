[platformio]
src_dir = espurna

[env:esp32-relay-x2]
platform = espressif32 @ 5.4.0
board = esp32dev
framework = arduino
build_flags = -DARDUINO_ARCH_ESP32 -DESP32_RELAY_X2 -DWEB_SUPPORT=1 -DAPI_SUPPORT=1 -DMQTT_SUPPORT=1 -DTERMINAL_SUPPORT=1 -DALEXA_SUPPORT=1 -DHOMEASSISTANT_SUPPORT=1 -DDOMOTICZ_SUPPORT=1 -DSENSOR_SUPPORT=1 -Wl,-z,muldefs -isystem espurna/arch/esp32/include
lib_deps = 
    esphome/AsyncTCP-esphome @ 2.1.4
    esphome/ESPAsyncWebServer-esphome @ 3.4.0
    bblanchon/ArduinoJson@5.13.4
    EEPROM
    heman/AsyncMqttClient-esphome @ 2.1.0
    vintlabs/FauxmoESP @ 3.4.1
lib_ignore = 
    AsyncTCP
build_src_filter = +<*> -<esp8266_pwm.c> -<storage_eeprom.cpp> +<storage_eeprom_esp32.cpp> -<wifi.cpp> +<wifi_esp32.cpp> +<compat_esp32.cpp> -<gpio.cpp> +<gpio_esp32.cpp> -<telnet.cpp> +<telnet_esp32.cpp> -<system.cpp> +<system_esp32.cpp>
extra_scripts = post:scripts/esp32_merge.py
