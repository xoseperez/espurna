; Beken BK72xx (Tuya CB2S / CB3S / WB2S ...) through LibreTiny
; py -3 -m platformio run -c platformio_beken.ini -e <env>
; Own build_dir, so switching between this and the ESP configs does not wipe .pio/build

[platformio]
src_dir = espurna
build_dir = .pio/build_beken

[beken-common]
platform = libretiny @ 1.14.0
framework = arduino
build_unflags = -std=gnu++11
; mutex_beken.h: std::mutex for every C++ unit (libraries too)
; LT_UART_DEFAULT_PORT=1: LibreTiny & SDK log (crash dumps too) on UART1, the flashing pads, instead of UART2 (P0)
; CONFIG_ASYNC_TCP_STACK_SIZE: FreeRTOS takes words here, not bytes as on ESP32. Library default (8192 * 2)
;   is 64 KiB, it left 6 KiB of heap and SoftAP clients could not connect. 2560 words is 10 KiB, enough for the web
;   server next to Matter. Each option is set once here: PlatformIO puts -U after every -D, `-UX -DX=1` leaves X undefined
; --wrap=bk_trap_*: our crash handlers keep the stability counter; --wrap=vApplicationMallocFailedHook: a failed
;   allocation leaves a crash record instead of a silent hang until the watchdog (ref. rtcmem_beken.cpp)
build_flags = -std=gnu++17 -includemutex_beken.h -DLT_UART_DEFAULT_PORT=1 -DCONFIG_ASYNC_TCP_STACK_SIZE=2560 -DWEB_SUPPORT=1 -DAPI_SUPPORT=1 -DMQTT_SUPPORT=1 -DTERMINAL_SUPPORT=1 -DHOMEASSISTANT_SUPPORT=1 -DALEXA_SUPPORT=1 -DDOMOTICZ_SUPPORT=1 -DSENSOR_SUPPORT=0 -DPWM_SUPPORT=0 -Iespurna/arch/beken -Wl,--wrap=bk_trap_udef -Wl,--wrap=bk_trap_pabt -Wl,--wrap=bk_trap_dabt -Wl,--wrap=bk_trap_resv -Wl,--wrap=vApplicationMallocFailedHook
lib_ldf_mode = deep+
lib_compat_mode = off
; same patched ESPAsyncWebServer as ESP32 (it already knows LIBRETINY)
; lib_beken/AsyncTCP-espurna: esphome AsyncTCP 2.1.4 with use-after-free fixes (dropped connections), instead of the registry one
; lib_beken/FauxmoESP: fauxmoESP 3.4.1 (Alexa) with the LibreTiny code paths
lib_extra_dirs =
    lib_esp32
    lib_beken
lib_deps =
    bblanchon/ArduinoJson@5.13.4
    heman/AsyncMqttClient-esphome @ 2.1.0
lib_ignore =
    AsyncTCP
    AsyncTCP-esphome
    ESPAsyncWebServer-esphome
build_src_filter = +<*> -<arch/esp8266> -<arch/esp32> +<arch/beken>
; No BLE (BK7231N SDK links the whole BLE 5.1 stack otherwise), OTA image has to fit the 664 KiB 'download' partition
; No PMF / WPA3: with them the supplicant fails the handshake (AUTH_FAIL) with OpenWrt psk2 + 802.11r + ieee80211w=1 APs
; .bss of ESPurna and of the Matter library in the data TCM, which only the Wi-Fi driver uses with BLE off: about
; 37 KiB more heap (ref. scripts/beken_tcm.py)
extra_scripts = post:scripts/beken_tcm.py
custom_tcm_bss = yes
custom_options.sys_config.h =
    CFG_SUPPORT_BLE = 0
    CFG_IEEE80211W = 0
    CFG_WPA3 = 0

; One image for every BK7231N board, whatever its bootloader (ref. arch/beken/layout_beken.cpp, told apart at boot):
; - Tuya bootloader, 2 MiB (CB1S, CB2S, CB3S, CBU, CB2L ...): Tuya flash layout and keys
; - Quectel bootloader, 4 MiB, no flash encryption: XH-CB2S / BK7231M of the Sparkleiot Mini, its Matter factory data used
; Every GPIO of the chip, no GPIOs pre-assigned (device template or settings). All modules, the 433 MHz receiver
; (rc-switch, unused until rfbRX is set) and Matter (IPv6 in lwIP, CONFIG_IPV6 of the BDK; quiet mode of matter.cpp while
; commissioning; the mDNS responder of ESPurna is off with Matter on LibreTiny, the Matter stack answers mDNS itself).
; The Matter code is linked into a region of its own (scripts/beken_matter_tail.py): in the 'download' partition of the
; Tuya layout, inside the application of the Quectel layout. Outputs:
; - espurna-beken.bin: OTA for any of them, ESPurna writes the part its bootloader takes (Tuya: upload it twice, the
;   second time it writes the Matter code; ref. arch/beken/ota_beken.cpp)
; - firmware.uf2: first flash over UART on the Tuya layout (and OTA from older firmware), then matter-tail.bin
; - espurna-beken-quectel.uf2: first flash over UART on the Quectel layout (and OTA from older firmware)
; Boards without Matter factory data make their own identity (development DAC 0xFFF1/0x8000) at the first start.
; Matter library: release asset of github.com/igorufox/matter-bk7231n (scripts/beken_matter_lib.py).
; bk7231n-any.json: the 'root' partition covers 4 MiB, for the partitions of the Quectel layout
[env:beken-bk7231n]
extends = beken-common
board = generic-bk7231n-qfn32-tuya
custom_board = boards_beken/bk7231n-any.json
build_flags = ${beken-common.build_flags} -DBEKEN_GENERIC -DRFB_SUPPORT=1 -DRFB_PROVIDER=RFB_PROVIDER_RCSWITCH -DCONFIG_IPV6 -DMATTER_SUPPORT=1 -DESPURNA_IMAGE=\"beken-matter\"
lib_deps =
    ${beken-common.lib_deps}
    https://github.com/1technophile/rc-switch#11402652
extra_scripts =
    pre:scripts/beken_matter_lib.py
    post:scripts/beken_matter_tail.py
    post:scripts/beken_tcm.py
custom_matter_tail = yes
custom_quectel_board = boards_beken/xh-cb2s-bk7231m.json
custom_matter_lib = latest
