; Beken BK72xx (Tuya CB2S / CB3S / WB2S ...) through LibreTiny
; py -3 -m platformio run -c platformio_beken.ini -e <env>
; Own build_dir, so switching between this and the ESP configs does not wipe .pio/build

[platformio]
src_dir = espurna
build_dir = .pio/build_beken

[beken-common]
platform = libretiny @ 1.14.0
framework = arduino
build_unflags = -std=gnu++11
; mutex_beken.h: std::mutex for every C++ unit (libraries too)
; LT_UART_DEFAULT_PORT=1: LibreTiny & SDK log (crash dumps too) on UART1, the flashing pads, instead of UART2 (P0)
; CONFIG_ASYNC_TCP_STACK_SIZE: FreeRTOS takes words here, not bytes as on ESP32. Library default (8192 * 2)
;   is 64 KiB, it left 6 KiB of heap and SoftAP clients could not connect. 3072 words is 12 KiB
; --wrap=bk_trap_*: our crash handlers keep the stability counter (ref. rtcmem_beken.cpp)
build_flags = -std=gnu++17 -includemutex_beken.h -DLT_UART_DEFAULT_PORT=1 -DCONFIG_ASYNC_TCP_STACK_SIZE=3072 -DWEB_SUPPORT=1 -DAPI_SUPPORT=1 -DMQTT_SUPPORT=1 -DTERMINAL_SUPPORT=1 -DHOMEASSISTANT_SUPPORT=1 -DALEXA_SUPPORT=0 -DDOMOTICZ_SUPPORT=0 -DSENSOR_SUPPORT=0 -DPWM_SUPPORT=0 -Iespurna/arch/beken -Wl,--wrap=bk_trap_udef -Wl,--wrap=bk_trap_pabt -Wl,--wrap=bk_trap_dabt -Wl,--wrap=bk_trap_resv
lib_ldf_mode = deep+
lib_compat_mode = off
; same patched ESPAsyncWebServer as ESP32 (it already knows LIBRETINY)
; lib_beken/AsyncTCP-espurna: esphome AsyncTCP 2.1.4 with use-after-free fixes (dropped connections), instead of the registry one
lib_extra_dirs =
    lib_esp32
    lib_beken
lib_deps =
    bblanchon/ArduinoJson@5.13.4
    heman/AsyncMqttClient-esphome @ 2.1.0
lib_ignore =
    AsyncTCP
    AsyncTCP-esphome
    ESPAsyncWebServer-esphome
build_src_filter = +<*> -<arch/esp8266> -<arch/esp32> +<arch/beken>
; No BLE (BK7231N SDK links the whole BLE 5.1 stack otherwise), OTA image has to fit the 664 KiB 'download' partition
; No PMF / WPA3: with them the supplicant fails the handshake (AUTH_FAIL) with OpenWrt psk2 + 802.11r + ieee80211w=1 APs
custom_options.sys_config.h =
    CFG_SUPPORT_BLE = 0
    CFG_IEEE80211W = 0
    CFG_WPA3 = 0

; Any Tuya BK7231N board (CB1S, CB2S, CB3S, CBU, CB2L ...): Tuya flash layout and keys, every GPIO of the chip mapped,
; no GPIOs pre-assigned (device template or settings). 433 MHz receiver (rc-switch) is in, unused until rfbRX is set
[env:beken-bk7231n]
extends = beken-common
board = generic-bk7231n-qfn32-tuya
build_flags = ${beken-common.build_flags} -DBEKEN_GENERIC -DRFB_SUPPORT=1 -DRFB_PROVIDER=RFB_PROVIDER_RCSWITCH
lib_deps =
    ${beken-common.lib_deps}
    https://github.com/1technophile/rc-switch#11402652

; Same, for BK7231N boards without flash encryption (eFuse key is zero) and with the 4 MiB layout of their own
; bootloader (app 0x11000, OTA 0x286000), e.g. the XH-CB2S (chip marked BK7231M) of the sparkleiot MINI V1.3
[env:beken-bk7231n-nokey]
extends = env:beken-bk7231n
custom_board = boards_beken/xh-cb2s-bk7231m.json

; Tuya TYWRA-RF: 1-channel relay with 433 MHz receiver, AC/DC 7-32V or 5V micro-USB, CB3S
[env:tuya-cb3s-relay-rf]
extends = beken-common
board = cb3s
build_flags = ${beken-common.build_flags} -DTUYA_CB3S_RELAY_RF
; 433 MHz receiver (RF bridge, rc-switch provider), same fork as the esp8266 builds
lib_deps =
    ${beken-common.lib_deps}
    https://github.com/1technophile/rc-switch#11402652

; Matter work: IPv6 in lwIP (CONFIG_IPV6 of the BDK), not released. Matter needs about 20 KB more heap than the
; full image leaves, so the extras are out: 433 MHz receiver, Home Assistant discovery, Thingspeak, Prometheus metrics
; and the mDNS of ESPurna (Matter has its own), telnet, scheduler, OTA client. Web stays: OTA upload and
; the terminal over the websocket. NTP stays: Matter checks certificate validity against the time
[env:matter-ipv6-test]
extends = env:beken-bk7231n-nokey
build_flags = ${beken-common.build_flags} -DBEKEN_GENERIC -DCONFIG_IPV6 -DMATTER_SUPPORT=1 -IC:/working/ginhub/matter-bk7231n/lwip-override -DRFB_SUPPORT=0 -DHOMEASSISTANT_SUPPORT=0 -DTHINGSPEAK_SUPPORT=0 -DPROMETHEUS_SUPPORT=0 -DMDNS_SERVER_SUPPORT=0 -DTELNET_SUPPORT=0 -DSCHEDULER_SUPPORT=0 -DOTA_CLIENT=OTA_CLIENT_NONE -DCONFIG_ASYNC_TCP_STACK_SIZE=2560 -LC:/working/ginhub/matter-bk7231n/out/plug-tuned/lib -Wl,--start-group -lMatterApp -Wl,--end-group
lib_deps = ${beken-common.lib_deps}

; Same, linked with the test build of the Matter library: SDK example attestation (VID 0xFFF1 / PID 0x8001) instead
; of the Quectel factory certificates, to tell a controller problem with the Quectel identity from anything else
[env:matter-test]
extends = env:matter-ipv6-test
build_flags = ${beken-common.build_flags} -DBEKEN_GENERIC -DCONFIG_IPV6 -DMATTER_SUPPORT=1 -IC:/working/ginhub/matter-bk7231n/lwip-override -DRFB_SUPPORT=0 -DHOMEASSISTANT_SUPPORT=0 -DTHINGSPEAK_SUPPORT=0 -DPROMETHEUS_SUPPORT=0 -DMDNS_SERVER_SUPPORT=0 -DTELNET_SUPPORT=0 -DSCHEDULER_SUPPORT=0 -DOTA_CLIENT=OTA_CLIENT_NONE -DCONFIG_ASYNC_TCP_STACK_SIZE=2560 -LC:/working/ginhub/matter-bk7231n/out/plug-test/lib -Wl,--start-group -lMatterApp -Wl,--end-group
