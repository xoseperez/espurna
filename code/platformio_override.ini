; User defined configuration for Moes MS-104B 2-Gang Switch Module

[env:moes-ms-104b]
extends = env:esp8266-1m-base
build_flags =
    ${common.build_flags}
    -DBUTTON_AC_FREQ=50
    -DMANUFACTURER="\"MOES\""
    -DDEVICE="\"MS_104B\""
    
    ; --- Switch 1 (GPIO 13) controls Relay 1 (GPIO 14) ---
    -DBUTTON1_PIN=13
    -DBUTTON1_CONFIG=BUTTON_FREQUENCY
    -DBUTTON1_RELAY=1
    -DBUTTON1_PRESS=BUTTON_ACTION_TOGGLE
    -DBUTTON1_RELEASE=BUTTON_ACTION_TOGGLE
    -DBUTTON1_DEBOUNCE_DELAY=100
    
    ; --- Switch 2 (GPIO 12) controls Relay 2 (GPIO 15) ---
    -DBUTTON2_PIN=12
    -DBUTTON2_CONFIG=BUTTON_FREQUENCY
    -DBUTTON2_RELAY=2
    -DBUTTON2_PRESS=BUTTON_ACTION_TOGGLE
    -DBUTTON2_RELEASE=BUTTON_ACTION_TOGGLE
    -DBUTTON2_DEBOUNCE_DELAY=100
    
    ; --- Onboard Button (GPIO 2) ---
    -DBUTTON3_PIN=2
    -DBUTTON3_CONFIG="BUTTON_PUSHBUTTON+BUTTON_DEFAULT_HIGH"
    -DBUTTON3_RELAY=1
    
    ; --- Relay 1 ---
    -DRELAY1_PIN=14
    -DRELAY1_TYPE=RELAY_TYPE_NORMAL
    
    ; --- Relay 2 ---
    -DRELAY2_PIN=15
    -DRELAY2_TYPE=RELAY_TYPE_NORMAL
    
    -DRELAY_SUPPORT=1