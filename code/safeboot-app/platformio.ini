; ESPurna safeboot for ESP32: the image of the factory partition of esp32_4mb_safeboot.csv (0x10000, 832 KB).
; Plain ESP-IDF (pioarduino platform, same as platformio_esp32.ini), the Arduino core alone was 960 KB.
;   pio run -d code/safeboot-app
; Size options in sdkconfig.defaults; a stale sdkconfig.esp32-safeboot here overrides them (delete it after changes)

[env:esp32-safeboot]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = espidf
board_build.partitions = ../esp32_4mb_safeboot.csv
board_upload.flash_size = 4MB
