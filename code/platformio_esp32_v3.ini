; ESP32 on Arduino-ESP32 core 3.x (ESP-IDF 5.x) via pioarduino - the port in progress, next to platformio_esp32.ini
; (core 2.0.9), which stays the release build until this one is proven on the boards.
; pioarduino needs PlatformIO Core >= 6.2; its tool installer (idf_tools.py) refuses MSYS, run it outside Git Bash.

[platformio]
src_dir = espurna

[esp32-v3-common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
board_build.partitions = min_spiffs.csv
; no dout: the pioarduino libraries come per memory type (dio_qspi / qio_qspi), dout has no sdkconfig.h. The board's
; bootloader sets the flash mode at boot; the matter-lab image built with dio runs on the lab board
framework = arduino
build_flags = -DARDUINO_ARCH_ESP32 -DWEB_SUPPORT=1 -DAPI_SUPPORT=1 -DMQTT_SUPPORT=1 -DTERMINAL_SUPPORT=1 -DALEXA_SUPPORT=1 -DHOMEASSISTANT_SUPPORT=1 -DDOMOTICZ_SUPPORT=1 -DSENSOR_SUPPORT=1 -DPWM_SUPPORT=1 -Iespurna/arch/esp32
; chain+: with deep+ the LDF of PlatformIO 6.2 left Networking off the include path of WiFi / AsyncTCP
lib_ldf_mode = chain+
lib_extra_dirs =
    lib_esp32
; AsyncTCP: ESP32Async's 3.x (same API) - esphome's 2.1.4 includes IPv6Address.h, gone in core 3.x
lib_deps =
    ESP32Async/AsyncTCP @ ^3.4.0
    bblanchon/ArduinoJson@5.13.4
    EEPROM
    ; core 3.x splits the network stack into its own libraries, the LDF does not find them from AsyncTCP
    Networking
    WiFi
    heman/AsyncMqttClient-esphome @ 2.1.0
    vintlabs/FauxmoESP @ 3.4.1
lib_ignore =
    AsyncTCP-esphome
    ESPAsyncWebServer-esphome
build_src_filter = +<*> -<arch/esp8266> +<arch/esp32>
extra_scripts =
    pre:scripts/esp32_v3_paths.py
    post:scripts/esp32_merge.py

; LC-Tech ESP32 2-relay board
[env:v3-esp32-relay-x2]
extends = esp32-v3-common
build_flags = ${esp32-v3-common.build_flags} -DESP32_RELAY_X2

; Any ESP32 with 4 MB flash, no GPIOs pre-assigned
[env:v3-esp32-generic]
extends = esp32-v3-common
build_flags = ${esp32-v3-common.build_flags} -DESP32_GENERIC
