name: Firmware Build

on:
  push:
    branches: [esp32-port]
    tags: ['esp32-*']
  pull_request:
    branches: [esp32-port]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: esp32-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # generic images, the board is picked in the WebUI (device template search / Tasmota import).
        # `name` is the release file name, espurna-<name>-*
        include:
        - { arch: esp32, config: platformio_esp32.ini, env: esp32-generic, name: esp32 }
        - { arch: esp32, config: platformio_esp32.ini, env: esp32-nspanel, name: esp32-nspanel }
        - { arch: beken, config: platformio_beken.ini, env: beken-bk7231n, name: beken-bk7231n }
        - { arch: beken, config: platformio_beken.ini, env: beken-bk7231n-nokey, name: beken-bk7231n-nokey }
        - { arch: esp8266, config: platformio.ini, env: esp8266-1m, name: esp8266-1m }
        - { arch: esp8266, config: platformio.ini, env: esp8266-1m-all, name: esp8266-1m-all }
        - { arch: esp8266, config: platformio.ini, env: esp8266-4m, name: esp8266-4m }
        # first step of the 2-step OTA on 1 MB boards
        - { arch: esp8266, config: platformio.ini, env: espurna-minimal-webui-1m, name: esp8266-1m-minimal }
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    - name: Cache pip
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-platformio
    - name: Cache PlatformIO
      uses: actions/cache@v6
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-pio-${{ matrix.env }}-${{ hashFiles(format('code/{0}', matrix.config)) }}
        restore-keys: |
          ${{ runner.os }}-pio-${{ matrix.env }}-
    - name: Install PlatformIO
      run: |
        # ESP32: pioarduino needs PlatformIO Core >= 6.2
        pip install -U 'platformio>=6.2'
    - name: Build
      working-directory: code
      env:
        # LDF deep+ evaluates preprocessor expressions with python eval, and '\e' (ESC)
        # in some framework header spams SyntaxWarning on python >= 3.12
        PYTHONWARNINGS: ignore::SyntaxWarning
      run: |
        # pio libs sometimes use raw hash instead of version, avoid useless warnings
        git config --global advice.detachedHead false
        pio run -c ${{ matrix.config }} -e ${{ matrix.env }}
    - name: Collect binaries
      run: |
        env=${{ matrix.env }}
        name=espurna-${{ matrix.name }}
        mkdir -p dist
        case "${{ matrix.arch }}" in
        esp32)
          build=code/.pio/build/${env}
          # merged image (bootloader + partitions + boot_app0 + app), flash at 0x0
          cp ${build}/espurna-${env}.bin dist/${name}-full.bin
          # app only, for OTA
          cp ${build}/firmware.bin dist/${name}-ota.bin
          ;;
        beken)
          build=code/.pio/build_beken/${env}
          # first flash over UART1 with ltchiptool, and OTA from the WebUI
          cp ${build}/firmware.uf2 dist/${name}.uf2
          # LibreTiny links raw_firmware.elf
          cp ${build}/raw_firmware.elf ${build}/firmware.elf
          ;;
        esp8266)
          build=code/.pio/build/${env}
          # serial flash at 0x0, and OTA from the WebUI
          cp ${build}/firmware.bin dist/${name}.bin
          # compressed, OTA on 1 MB boards after the minimal image (eboot unpacks gzip)
          gzip -9 -n -c ${build}/firmware.bin > dist/${name}.bin.gz
          ;;
        esac
        cp ${build}/firmware.elf dist/${name}.elf
        ls -l dist
    - uses: actions/upload-artifact@v7
      with:
        name: espurna-${{ matrix.env }}-${{ github.sha }}
        path: dist/

  # every push to esp32-port (or esp32-* tag, or manual run) becomes a single release
  # with the images of all boards, same as upstream snapshot builds
  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: espurna-*-${{ github.sha }}
        merge-multiple: true
        path: dist/
    - name: Release variables
      id: release
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/esp32-* ]]; then
          tag="${GITHUB_REF_NAME}"
        else
          tag="esp32-$(date +'%y%m%d')-${GITHUB_SHA::7}"
        fi
        echo "tag=${tag}" >> "$GITHUB_OUTPUT"
        ls -l dist
    - uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.release.outputs.tag }}
        target_commitish: ${{ github.sha }}
        name: Firmware build (${{ steps.release.outputs.tag }})
        body: |
          Automatic build of ${{ github.ref_name }} @ ${{ github.sha }}

          One image per chip, the board is picked after flashing: WebUI, ADMIN, *Device Template* (Tasmota templates, OpenBeken devices and the boards of this firmware) or *Tasmota Profile Import*.

          ESP32, Arduino-ESP32 core 3 (ESP-IDF 5), Matter On/Off plugs included, Tasmota safeboot flash layout (ESPurna at 0xE0000, 2880 KB; `*-full.bin` - merged image, flash at 0x0, then put the Tasmota safeboot image to 0x10000; `*-ota.bin` - application only, upload it from the safeboot web UI after the `safeboot` command):
          - `espurna-esp32-*` - any ESP32 with 4 MB flash
          - `espurna-esp32-nspanel-*` - Sonoff NSPanel EU (gen1) with the Lovelace UI TFT, see `nspanel/README.md`

          Beken BK7231N (`*.uf2` - first flash over UART1 with `ltchiptool`, then OTA from the WebUI, see `beken/README.md`):
          - `espurna-beken-bk7231n.uf2` - any Tuya BK7231N board (CB2S, CB3S, CBU ...), 433 MHz receiver included (rc-switch, pin from `rfbRX`)
          - `espurna-beken-bk7231n-nokey.uf2` - BK7231N without flash encryption and with a 4 MiB layout, e.g. the XH-CB2S / BK7231M of the Sparkleiot Mini (`beken/sparkleiot-mini.md`)

          ESP8266, core 3.1.2 + SDK 3.0.5 (`*.bin` - serial flash at 0x0 or OTA; `*.bin.gz` - compressed OTA):
          - `espurna-esp8266-1m` - relays, buttons, AC mains switches, LEDs, dummy relays
          - `espurna-esp8266-1m-all` - + PWM light and Sonoff RF Bridge (no serial debug / terminal, UART0 belongs to the RF chip)
          - `espurna-esp8266-4m` - boards installed with the 4 MB layout
          - `espurna-esp8266-1m-minimal` - first step of the 2-step OTA on 1 MB boards, then the `.bin.gz`
        make_latest: true
        files: |
          dist/*.bin
          dist/*.bin.gz
          dist/*.uf2
    # keep only the newest automatic builds (esp32-YYMMDD-sha); releases of hand-made esp32-* tags stay
    - name: Prune old automatic releases
      env:
        GH_TOKEN: ${{ github.token }}
        KEEP: 5
      run: |
        gh release list --repo "${GITHUB_REPOSITORY}" --limit 200 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[].tagName' \
          | grep -E '^esp32-[0-9]{6}-[0-9a-f]{7}$' \
          | tail -n +$((KEEP + 1)) \
          | while read -r tag; do
              echo "deleting ${tag}"
              gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes
            done
